<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/trophy.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContestDB — Run any contest, ranked in the ledger</title>
    <!-- Set the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('contestdb_theme');
          document.documentElement.setAttribute('data-theme', t || 'guild');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'guild'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
